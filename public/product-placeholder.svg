<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141318" />
      <stop offset="50%" stop-color="#0a090d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b20" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Arrière-plan sombre -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <circle cx="300" cy="380" r="260" fill="url(#glowGrad)" />

  <!-- Bordure fine dorée intérieure -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="#d4af37" stroke-opacity="0.18" stroke-width="1.5" />
  <rect x="28" y="28" width="544" height="744" rx="12" fill="none" stroke="#d4af37" stroke-opacity="0.08" stroke-width="1" />

  <!-- Éléments de coin décoratifs -->
  <path d="M 20 50 L 50 20" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />
  <path d="M 580 50 L 550 20" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />
  <path d="M 20 750 L 50 780" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />
  <path d="M 580 750 L 550 780" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />

  <!-- Icône centrale : Sac / Vêtement de luxe stylisé -->
  <g transform="translate(300, 360)">
    <!-- Cercle doré élégant -->
    <circle cx="0" cy="0" r="70" fill="#0d0c11" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" />

    <!-- Silhouette sac de luxe -->
    <path d="M -22 -15 C -22 -30, 22 -30, 22 -15" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -32 -10 L 32 -10 L 26 34 C 26 38, 22 41, 17 41 L -17 41 C -22 41, -26 38, -26 34 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="-32" y1="-2" x2="32" y2="-2" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="0" cy="14" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Typographie SDM STORE -->
  <text x="300" y="490" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="8">SDM STORE</text>
  <text x="300" y="520" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="3" text-transform="uppercase">Visualisation produit</text>

  <!-- Ligne séparatrice dorée -->
  <line x1="240" y1="540" x2="360" y2="540" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />
</svg>

