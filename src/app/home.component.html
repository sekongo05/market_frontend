<div class="bg-[#faf8f5] text-[#111111]">

  <!-- Lien d'évitement accessibilité -->
  <a href="#main-content"
     class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100000] focus:bg-[#0a0a0a] focus:px-4 focus:py-2 focus:text-xs focus:font-semibold focus:uppercase focus:tracking-[0.2em] focus:text-[#d4af37]">
    Aller au contenu principal
  </a>

  <!-- 1. Hero multi-visuels Triptyque (3 univers dès l'ouverture) -->
  <app-home-hero
    [isLoggedIn]="isLoggedIn()"
    [firstOrderPromo]="firstOrderPromo()"
    (searchSubmit)="onSearch($event)" />

  <!-- 2. Les Univers (Grille architecturale symétrique) -->
  <app-home-collections
    [categories]="categories()"
    [loading]="categoriesLoading()"
    [error]="categoriesError()"
    (selectCategory)="onSelectCategory($event)"
    (retry)="loadCategories()" />

  <!-- 3. Pièces choisies : La Sélection · Nouveautés · Meilleures Ventes -->
  <app-home-showcase-tabs
    [featuredProducts]="featuredProducts()"
    [featuredLoading]="featuredLoading()"
    [featuredError]="featuredError()"
    [newProducts]="newProducts()"
    [newLoading]="newProductsLoading()"
    [newError]="newProductsError()"
    [bestsellers]="bestsellers()"
    [bestsellersLoading]="bestsellersLoading()"
    [bestsellersError]="bestsellersError()"
    [cartIds]="cartProductIds()"
    [favoriteIds]="favoriteIds()"
    (quickAdd)="onQuickAddProduct($event)"
    (toggleFavorite)="onToggleFavoriteProduct($event)"
    (retryTab)="onRetryTab($event)" />

  <!-- 4. Sélection Privée (affiché si offres actives) -->
  <app-home-campaign-offer
    [deals]="discountProducts()"
    [loading]="newProductsLoading()"
    [cartIds]="cartProductIds()"
    [favoriteIds]="favoriteIds()"
    (quickAdd)="onQuickAddProduct($event)"
    (toggleFavorite)="onToggleFavoriteProduct($event)" />

  <!-- 5. La Maison SDM (Séquence pierre chaude · Savoir-faire · Chiffres · Engagements) -->
  <app-home-maison
    [publicStats]="publicStats()"
    [statsError]="statsError()"
    (retryStats)="loadPublicStats()" />

  <!-- 6. Notes & Témoignages -->
  <app-home-testimonials
    [reviews]="featuredReviews()"
    [loading]="reviewsLoading()"
    [error]="reviewsError()"
    [averageRating]="publicStats()?.averageRating ?? null"
    [totalReviews]="publicStats()?.totalReviews ?? null"
    (retry)="loadReviews()" />

  <!-- 7. Campagne & Réseaux -->
  <app-home-lookbook
    [whatsAppUrl]="whatsAppUrl"
    [isLoggedIn]="isLoggedIn()" />

</div>
